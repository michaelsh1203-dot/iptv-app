<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player - Direct Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; }
    </style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 p-4 flex justify-between items-center shadow-lg z-10">
        <h1 class="text-xl font-bold text-cyan-400">IPTV Player (ישיר מהמכשיר)</h1>
        <button onclick="openModal()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-md shadow-cyan-900/50">
            👤 חשבונות
        </button>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar: Categories & Streams -->
        <aside class="w-1/3 max-w-sm bg-slate-900/90 border-l border-slate-800 flex flex-col">
            <div class="flex border-b border-slate-800 text-sm font-medium">
                <button id="tab-live" onclick="switchTab('live')" class="flex-1 py-3 text-center border-b-2 border-cyan-500 text-cyan-400 font-bold transition">Live TV</button>
                <button id="tab-movies" onclick="switchTab('movies')" class="flex-1 py-3 text-center text-slate-400 hover:text-slate-200 transition">סרטים</button>
                <button id="tab-series" onclick="switchTab('series')" class="flex-1 py-3 text-center text-slate-400 hover:text-slate-200 transition">סדרות</button>
            </div>

            <div class="p-3 border-b border-slate-800">
                <select id="category-select" onchange="filterChannels()" class="w-full bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl text-sm focus:outline-none focus:border-cyan-500">
                    <option value="all">כל הקטגוריות</option>
                </select>
            </div>

            <!-- Grid of Channels -->
            <div id="items-list" class="flex-1 overflow-y-auto p-3 grid grid-cols-1 gap-2">
                <div class="text-center text-slate-500 py-10 col-span-full">טוען נתונים...</div>
            </div>
        </aside>

        <!-- Video Player Display -->
        <main class="flex-1 flex flex-col bg-slate-950 justify-center items-center relative p-6">
            <div class="w-full max-w-5xl aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800 relative flex items-center justify-center">
                <video id="video-player" controls autoplay class="w-full h-full object-contain"></video>
            </div>
            <div id="current-title" class="mt-4 text-lg font-bold text-slate-200 tracking-wide">בחר ערוץ לצפייה</div>
        </main>
    </div>

    <!-- Modal settings -->
    <div id="account-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex justify-center items-center hidden z-50">
        <div class="bg-slate-900 p-6 rounded-2xl w-96 border border-slate-800 shadow-2xl">
            <h2 class="text-lg font-bold mb-4 text-white">הגדרות חשבון IPTV</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">כתובת שרת (Server URL)</label>
                    <input type="text" id="cfg-server" class="w-full bg-slate-950 border border-slate-800 text-white p-2.5 rounded-xl text-sm focus:outline-none focus:border-cyan-500" dir="ltr" placeholder="https://tv.example.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">שם משתמש (Username)</label>
                    <input type="text" id="cfg-user" class="w-full bg-slate-950 border border-slate-800 text-white p-2.5 rounded-xl text-sm focus:outline-none focus:border-cyan-500" dir="ltr">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">סיסמה (Password)</label>
                    <input type="password" id="cfg-pass" class="w-full bg-slate-950 border border-slate-800 text-white p-2.5 rounded-xl text-sm focus:outline-none focus:border-cyan-500" dir="ltr">
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-2 space-x-reverse">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-sm rounded-xl transition">ביטול</button>
                <button onclick="saveAccount()" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-cyan-900/50">שמור והתחבר</button>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'live';
        let categories = [];
        let streams = [];
        let hls = null;

        document.addEventListener('DOMContentLoaded', () => {
            const server = localStorage.getItem('iptv_server') || 'https://tv.business-cloud-8.ru';
            const user = localStorage.getItem('iptv_user') || '';
            const pass = localStorage.getItem('iptv_pass') || '';

            document.getElementById('cfg-server').value = server;
            document.getElementById('cfg-user').value = user;
            document.getElementById('cfg-pass').value = pass;

            if (user && pass) {
                initApp();
            } else {
                openModal();
            }
        });

        function openModal() { document.getElementById('account-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('account-modal').classList.add('hidden'); }

        function saveAccount() {
            let server = document.getElementById('cfg-server').value.trim();
            if (server.endsWith('/')) server = server.slice(0, -1);
            localStorage.setItem('iptv_server', server);
            localStorage.setItem('iptv_user', document.getElementById('cfg-user').value.trim());
            localStorage.setItem('iptv_pass', document.getElementById('cfg-pass').value.trim());
            closeModal();
            initApp();
        }

        async function initApp() {
            const server = localStorage.getItem('iptv_server');
            const user = localStorage.getItem('iptv_user');
            const pass = localStorage.getItem('iptv_pass');

            if (!user || !pass) return;

            document.getElementById('items-list').innerHTML = '<div class="text-center text-slate-400 py-10 col-span-full">טוען ערוצים ואריחים...</div>';

            try {
                let catAction = currentTab === 'movies' ? 'get_vod_categories' : currentTab === 'series' ? 'get_series_categories' : 'get_live_categories';
                const catRes = await fetch(`${server}/player_api.php?username=${user}&password=${pass}&action=${catAction}`);
                categories = await catRes.json();
                populateCategories();

                let streamAction = currentTab === 'movies' ? 'get_vod_streams' : currentTab === 'series' ? 'get_series' : 'get_live_streams';
                const streamRes = await fetch(`${server}/player_api.php?username=${user}&password=${pass}&action=${streamAction}`);
                streams = await streamRes.json();

                renderStreams(streams);
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('items-list').innerHTML = '<div class="text-center text-red-400 py-10 col-span-full">שגיאה בטעינת נתונים (ודא שכתובת השרת תומכת ב-HTTPS)</div>';
            }
        }

        function populateCategories() {
            const select = document.getElementById('category-select');
            select.innerHTML = '<option value="all">כל הקטגוריות</option>';
            if (Array.isArray(categories)) {
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.category_id;
                    opt.textContent = cat.category_name;
                    select.appendChild(opt);
                });
            }
        }

        function renderStreams(items) {
            const container = document.getElementById('items-list');
            container.innerHTML = '';

            if (!Array.isArray(items) || items.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-500 py-10 col-span-full">לא נמצאו פריטים</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 hover:border-cyan-500/50 p-3 rounded-2xl cursor-pointer transition shadow-md flex items-center justify-between group';
                
                const title = item.name || item.title || 'ערוץ';
                const streamId = item.stream_id || item.series_id;
                const ext = item.container_extension || 'mp4';

                card.innerHTML = `<span class="truncate text-sm font-semibold text-slate-200 group-hover:text-cyan-400 transition">${title}</span>
                                  <span class="text-xs bg-slate-900 text-slate-400 px-2 py-1 rounded-lg">▶ צפה</span>`;
                
                card.onclick = () => playStream(streamId, title, ext);
                container.appendChild(card);
            });
        }

        function filterChannels() {
            const catId = document.getElementById('category-select').value;
            if (catId === 'all') {
                renderStreams(streams);
            } else {
                renderStreams(streams.filter(s => s.category_id === catId));
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            ['live', 'movies', 'series'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = 'flex-1 py-3 text-center border-b-2 border-cyan-500 text-cyan-400 font-bold transition';
                } else {
                    btn.className = 'flex-1 py-3 text-center text-slate-400 hover:text-slate-200 transition';
                }
            });
            initApp();
        }

        function playStream(streamId, title, ext) {
            const server = localStorage.getItem('iptv_server');
            const user = localStorage.getItem('iptv_user');
            const pass = localStorage.getItem('iptv_pass');

            document.getElementById('current-title').textContent = title;

            let rawUrl = '';
            if (currentTab === 'live') {
                rawUrl = `${server}/live/${user}/${pass}/${streamId}.m3u8`;
            } else if (currentTab === 'movies') {
                rawUrl = `${server}/movie/${user}/${pass}/${streamId}.${ext || 'mp4'}`;
            } else {
                rawUrl = `${server}/series/${user}/${pass}/${streamId}.${ext || 'mp4'}`;
            }

            const video = document.getElementById('video-player');

            if (hls) {
                hls.destroy();
                hls = null;
            }

            if (Hls.isSupported() && (currentTab === 'live' || rawUrl.endsWith('.m3u8'))) {
                hls = new Hls();
                hls.loadSource(rawUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Play error:", e));
                });
            } else {
                video.src = rawUrl;
                video.play().catch(e => console.log("Play error:", e));
            }
        }
    </script>
</body>
</html>
