<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for video streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
        }
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-800 p-4 flex justify-between items-center shadow-lg border-b border-slate-700">
        <h1 class="text-xl font-bold text-blue-400">IPTV Player (ספק ראשי)</h1>
        <button id="account-btn" onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
            👤 חשבונות
        </button>
    </header>

    <!-- Main Content Grid -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar / Categories & Channels -->
        <aside class="w-1/3 max-w-sm bg-slate-900 border-l border-slate-800 flex flex-col">
            <!-- Tabs -->
            <div class="flex border-b border-slate-800 text-sm font-medium">
                <button id="tab-live" onclick="switchTab('live')" class="flex-1 py-3 text-center border-b-2 border-blue-500 text-blue-400 font-bold">Live TV</button>
                <button id="tab-movies" onclick="switchTab('movies')" class="flex-1 py-3 text-center text-slate-400 hover:text-slate-200">סרטים</button>
                <button id="tab-series" onclick="switchTab('series')" class="flex-1 py-3 text-center text-slate-400 hover:text-slate-200">סדרות</button>
            </div>

            <!-- Category Selector -->
            <div class="p-2 border-b border-slate-800">
                <select id="category-select" onchange="filterChannels()" class="w-full bg-slate-800 border border-slate-700 text-white p-2 rounded-md text-sm focus:outline-none focus:border-blue-500">
                    <option value="all">כל הקטגוריות</option>
                </select>
            </div>

            <!-- Items List -->
            <div id="items-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <div class="text-center text-slate-500 py-8">טוען נתונים...</div>
            </div>
        </aside>

        <!-- Main Video Area -->
        <main class="flex-1 flex flex-col bg-black justify-center items-center relative">
            <div class="w-full max-w-4xl video-container bg-slate-950 rounded-lg overflow-hidden shadow-2xl border border-slate-800">
                <video id="video-player" controls autoplay class="w-full h-full"></video>
            </div>
            <div id="current-title" class="mt-4 text-lg font-semibold text-slate-300">בחר ערוץ לצפייה</div>
        </main>
    </div>

    <!-- Accounts / Settings Modal -->
    <div id="account-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex justify-center items-center hidden z-50">
        <div class="bg-slate-800 p-6 rounded-xl w-96 border border-slate-700 shadow-2xl">
            <h2 class="text-lg font-bold mb-4 text-white">הגדרות חשבון IPTV</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">כתובת שרת (Server URL)</label>
                    <input type="text" id="cfg-server" placeholder="http://tv.business-cloud-8.ru" class="w-full bg-slate-900 border border-slate-700 text-white p-2 rounded text-sm focus:outline-none focus:border-blue-500" dir="ltr">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">שם משתמש (Username)</label>
                    <input type="text" id="cfg-user" class="w-full bg-slate-900 border border-slate-700 text-white p-2 rounded text-sm focus:outline-none focus:border-blue-500" dir="ltr">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">סיסמה (Password)</label>
                    <input type="password" id="cfg-pass" class="w-full bg-slate-900 border border-slate-700 text-white p-2 rounded text-sm focus:outline-none focus:border-blue-500" dir="ltr">
                </div>
            </div>

            <div class="mt-6 flex justify-end space-x-2 space-x-reverse">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white text-sm rounded transition">ביטול</button>
                <button onclick="saveAccount()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded transition">שמור והתחבר</button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let currentTab = 'live';
        let categories = [];
        let streams = [];
        let hls = null;

        // Load config from localStorage on boot
        document.addEventListener('DOMContentLoaded', () => {
            const server = localStorage.getItem('iptv_server') || 'http://tv.business-cloud-8.ru';
            const user = localStorage.getItem('iptv_user') || '';
            const pass = localStorage.getItem('iptv_pass') || '';

            document.getElementById('cfg-server').value = server;
            document.getElementById('cfg-user').value = user;
            document.getElementById('cfg-pass').value = pass;

            if (user && pass) {
                initApp();
            } else {
                openModal();
            }
        });

        function openModal() { document.getElementById('account-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('account-modal').classList.add('hidden'); }

        function saveAccount() {
            let server = document.getElementById('cfg-server').value.trim();
            if (server.endsWith('/')) server = server.slice(0, -1);

            localStorage.setItem('iptv_server', server);
            localStorage.setItem('iptv_user', document.getElementById('cfg-user').value.trim());
            localStorage.setItem('iptv_pass', document.getElementById('cfg-pass').value.trim());

            closeModal();
            initApp();
        }

        // Helper to construct secure Proxy URLs using relative path
        function getProxyUrl(targetUrl) {
            return `/proxy?url=${encodeURIComponent(targetUrl)}`;
        }

        async function initApp() {
            const server = localStorage.getItem('iptv_server');
            const user = localStorage.getItem('iptv_user');
            const pass = localStorage.getItem('iptv_pass');

            if (!user || !pass) return;

            document.getElementById('items-list').innerHTML = '<div class="text-center text-slate-400 py-8">טוען ערוצים...</div>';

            try {
                // Fetch Categories
                let catAction = 'get_live_categories';
                if (currentTab === 'movies') catAction = 'get_vod_categories';
                if (currentTab === 'series') catAction = 'get_series_categories';

                const catTarget = `${server}/player_api.php?username=${user}&password=${pass}&action=${catAction}`;
                const catRes = await fetch(getProxyUrl(catTarget));
                categories = await catRes.json();

                populateCategories();

                // Fetch Streams
                let streamAction = 'get_live_streams';
                if (currentTab === 'movies') streamAction = 'get_vod_streams';
                if (currentTab === 'series') streamAction = 'get_series';

                const streamTarget = `${server}/player_api.php?username=${user}&password=${pass}&action=${streamAction}`;
                const streamRes = await fetch(getProxyUrl(streamTarget));
                streams = await streamRes.json();

                renderStreams(streams);

            } catch (err) {
                console.error('Error loading IPTV data:', err);
                document.getElementById('items-list').innerHTML = '<div class="text-center text-red-400 py-8">שגיאה שטעינת נתונים</div>';
            }
        }

        function populateCategories() {
            const select = document.getElementById('category-select');
            select.innerHTML = '<option value="all">כל הקטגוריות</option>';
            if (Array.isArray(categories)) {
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.category_id;
                    opt.textContent = cat.category_name;
                    select.appendChild(opt);
                });
            }
        }

        function renderStreams(items) {
            const container = document.getElementById('items-list');
            container.innerHTML = '';

            if (!Array.isArray(items) || items.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-500 py-8">לא נמצאו פריטים</div>';
                return;
            }

            items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-right p-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm flex items-center justify-between transition border border-slate-700/50 mb-1';
                
                const title = item.name || item.title || 'ללא שם';
                const streamId = item.stream_id || item.series_id;
                const containerExtension = item.container_extension || 'm3u8';

                btn.innerHTML = `<span class="truncate font-medium">${title}</span>`;
                btn.onclick = () => playStream(streamId, title, containerExtension);

                container.appendChild(btn);
            });
        }

        function filterChannels() {
            const catId = document.getElementById('category-select').value;
            if (catId === 'all') {
                renderStreams(streams);
            } else {
                const filtered = streams.filter(s => s.category_id === catId);
                renderStreams(filtered);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            ['live', 'movies', 'series'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = 'flex-1 py-3 text-center border-b-2 border-blue-500 text-blue-400 font-bold';
                } else {
                    btn.className = 'flex-1 py-3 text-center text-slate-400 hover:text-slate-200';
                }
            });
            initApp();
        }

        function playStream(streamId, title, ext) {
            const server = localStorage.getItem('iptv_server');
            const user = localStorage.getItem('iptv_user');
            const pass = localStorage.getItem('iptv_pass');

            document.getElementById('current-title').textContent = title;

            let rawStreamUrl = '';
            if (currentTab === 'live') {
                rawStreamUrl = `${server}/live/${user}/${pass}/${streamId}.m3u8`;
            } else if (currentTab === 'movies') {
                rawStreamUrl = `${server}/movie/${user}/${pass}/${streamId}.${ext || 'mp4'}`;
            } else if (currentTab === 'series') {
                rawStreamUrl = `${server}/series/${user}/${pass}/${streamId}.${ext || 'mp4'}`;
            }

            const proxiedUrl = getProxyUrl(rawStreamUrl);
            const video = document.getElementById('video-player');

            if (Hls.isSupported() && (rawStreamUrl.endsWith('.m3u8') || currentTab === 'live')) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(proxiedUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = proxiedUrl;
                video.play();
            } else {
                video.src = proxiedUrl;
                video.play();
            }
        }
    </script>
</body>
</html>
