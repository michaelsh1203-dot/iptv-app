<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold text-cyan-400 flex items-center gap-2">
            📺 IPTV Player
        </h1>
        <div class="flex items-center gap-2">
            <button onclick="openModal()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm transition">
                ⚙️ הגדרות
            </button>
        </div>
    </header>

    <!-- Main Player & Grid Layout -->
    <main class="flex-1 p-4 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto w-full">
        <!-- Player Container -->
        <div class="lg:col-span-2 flex flex-col gap-3">
            <div class="relative bg-black rounded-2xl overflow-hidden aspect-video shadow-2xl flex items-center justify-center border border-slate-800">
                <video id="video-player" controls class="w-full h-full"></video>
            </div>
            <div id="status-msg" class="text-xs text-slate-400 min-h-[20px]"></div>
        </div>

        <!-- Channels Container -->
        <div class="bg-slate-800/50 rounded-2xl border border-slate-700/50 p-4 flex flex-col gap-3 h-[600px]">
            <input type="text" id="search-input" oninput="filterChannels()" placeholder="חיפוש ערוץ..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-cyan-500">
            <div id="grid-container" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl flex flex-col gap-4">
            <h2 class="text-lg font-bold text-cyan-400 flex items-center gap-2">
                ⚙️ הגדרות שרת IPTV ופרוקסי
            </h2>

            <div class="space-y-3 text-sm">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">כתובת שרת IPTV</label>
                    <input type="text" id="cfg-server" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">שם משתמש</label>
                    <input type="text" id="cfg-user" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">סיסמה</label>
                    <input type="password" id="cfg-pass" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">שרת פרוקסי ענן / מקומי (אופציונלי)</label>
                    <input type="text" id="cfg-proxy" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:border-cyan-500">
                </div>
            </div>

            <div class="flex items-center justify-between pt-4 border-t border-slate-700">
                <button onclick="saveSettings()" class="px-5 py-2.5 bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-xs text-white font-semibold rounded-xl transition shadow-lg">
                    שמור והתחבר
                </button>
                <button onclick="closeModal()" class="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-xs text-slate-300 rounded-xl transition">
                    ביטול
                </button>
                <button onclick="resetData()" class="px-3 py-2.5 text-xs text-red-400 hover:text-red-300 transition">
                    אפס נתונים
                </button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_PROVIDER = {
            server: 'http://thy30188.wd.business-cloud-8.ru',
            user: 'd48e6682bdb8',
            pass: 'a6af461b63'
        };

        let hls = new Hls();
        let allChannels = [
            { stream_id: '101', name: 'ערוץ בדיקה ראשי (Live)', url: '' }
        ];

        function openModal() {
            document.getElementById('cfg-server').value = localStorage.getItem('iptv_server') || DEFAULT_PROVIDER.server;
            document.getElementById('cfg-user').value = localStorage.getItem('iptv_user') || DEFAULT_PROVIDER.user;
            document.getElementById('cfg-pass').value = localStorage.getItem('iptv_pass') || DEFAULT_PROVIDER.pass;
            document.getElementById('cfg-proxy').value = localStorage.getItem('iptv_proxy') || '/proxy';
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveSettings() {
            localStorage.setItem('iptv_server', document.getElementById('cfg-server').value.trim());
            localStorage.setItem('iptv_user', document.getElementById('cfg-user').value.trim());
            localStorage.setItem('iptv_pass', document.getElementById('cfg-pass').value.trim());
            localStorage.setItem('iptv_proxy', document.getElementById('cfg-proxy').value.trim() || '/proxy');
            closeModal();
            initApp();
        }

        function resetData() {
            localStorage.clear();
            location.reload();
        }

        function getProxyUrl(target) {
            const proxy = localStorage.getItem('iptv_proxy') || '/proxy';
            return `${proxy}?url=${encodeURIComponent(target)}`;
        }

        async function initApp() {
            let server = localStorage.getItem('iptv_server') || DEFAULT_PROVIDER.server;
            let user = localStorage.getItem('iptv_user') || DEFAULT_PROVIDER.user;
            let pass = localStorage.getItem('iptv_pass') || DEFAULT_PROVIDER.pass;

            if (!localStorage.getItem('iptv_server')) {
                localStorage.setItem('iptv_server', server);
                localStorage.setItem('iptv_user', user);
                localStorage.setItem('iptv_pass', pass);
            }

            // Using get.php format supported by the provider
            const apiUrl = `${server}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`;
            const proxyUrl = getProxyUrl(apiUrl);

            try {
                document.getElementById('status-msg').innerText = 'טוען ערוצים מהשרת...';
                const res = await fetch(proxyUrl);
                
                if (!res.ok) throw new Error('שגיאה בטעינת הנתונים');
                
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    allChannels = data.map(item => ({
                        stream_id: item.stream_id,
                        name: item.name || 'ערוץ ללא שם',
                        url: `${server}/live/${user}/${pass}/${item.stream_id}.m3u8`
                    }));
                }
                
                renderChannels(allChannels);
                document.getElementById('status-msg').innerText = `נטענו בהצלחה ${allChannels.length} ערוצים`;
            } catch (err) {
                console.warn('Fallback to default channels due to network error:', err);
                renderChannels(allChannels);
                document.getElementById('status-msg').innerText = 'מציג ערוצי גיבוי (בדוק חיבור או פרטי ספק)';
            }
        }

        function renderChannels(channels) {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            channels.forEach((ch) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-right p-3 bg-slate-800 hover:bg-slate-700 rounded-xl transition border border-slate-700/50 flex items-center justify-between group';
                btn.innerHTML = `<span class="font-medium text-sm text-slate-200 group-hover:text-cyan-400">${ch.name}</span><span class="text-xs text-cyan-400">▶ נגן</span>`;
                btn.onclick = () => playStream(ch.url || `${localStorage.getItem('iptv_server')}/live/${localStorage.getItem('iptv_user')}/${localStorage.getItem('iptv_pass')}/${ch.stream_id}.m3u8`);
                container.appendChild(btn);
            });
        }

        function filterChannels() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allChannels.filter(c => c.name.toLowerCase().includes(query));
            renderChannels(filtered);
        }

        function playStream(url) {
            const video = document.getElementById('video-player');
            const streamUrl = getProxyUrl(url);

            if (hls) {
                hls.destroy();
                hls = null;
            }

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => console.log('Autoplay blocked')));
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.play().catch(e => console.log('Autoplay blocked'));
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
