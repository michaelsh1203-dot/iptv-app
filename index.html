<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold text-cyan-400 flex items-center gap-2">
            📺 IPTV Player
        </h1>
        <div class="flex items-center gap-2">
            <button onclick="loadChannels()" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 rounded-lg text-sm font-bold transition shadow-lg cursor-pointer">
                ▶ טען ערוצים עכשיו
            </button>
        </div>
    </header>

    <!-- Main Player & Grid Layout -->
    <main class="flex-1 p-4 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto w-full">
        <!-- Player Container -->
        <div class="lg:col-span-2 flex flex-col gap-3">
            <div class="relative bg-black rounded-2xl overflow-hidden aspect-video shadow-2xl flex items-center justify-center border border-slate-800">
                <video id="video-player" controls class="w-full h-full"></video>
            </div>
            <div id="status-msg" class="text-sm text-cyan-400 font-bold min-h-[30px] bg-slate-800/80 p-3 rounded-lg border border-slate-700 text-center">לחץ על כפתור "טען ערוצים עכשיו" למעלה</div>
        </div>

        <!-- Channels Container -->
        <div class="bg-slate-800/50 rounded-2xl border border-slate-700/50 p-4 flex flex-col gap-3 h-[600px]">
            <input type="text" id="search-input" oninput="filterChannels()" placeholder="חיפוש ערוץ..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-cyan-500">
            <div id="grid-container" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
        </div>
    </main>

  <script>
        let hls = null;
        let allChannels = [];
        
        const IPTV_SERVER = 'http://thy30188.wd.business-cloud-8.ru';
        const IPTV_USER = 'd48e6682bdb8';
        const IPTV_PASS = 'a6af461b63';

        async function loadChannels() {
            const statusEl = document.getElementById('status-msg');
            
            try {
                statusEl.innerText = '🔄 טוען ערוצים מהשרת...';
                
                const res = await fetch('/api/channels');
                if (!res.ok) throw new Error(`שגיאת שרת: ${res.status}`);
                
                const data = await res.json();
                console.log("Channels Data:", data);

                let rawList = Array.isArray(data) ? data : Object.values(data);

                allChannels = rawList.map(item => ({
                    name: item.name || 'ערוץ ללא שם',
                    url: `${IPTV_SERVER}/live/${IPTV_USER}/${IPTV_PASS}/${item.stream_id}.m3u8`
                })).filter(ch => ch.url && !ch.url.includes('undefined'));

                if (allChannels.length > 0) {
                    renderChannels(allChannels);
                    statusEl.innerText = `✅ נטענו בהצלחה ${allChannels.length} ערוצים!`;
                } else {
                    statusEl.innerText = '⚠️ רשימת הערוצים ריקה';
                }
            } catch (err) {
                console.error('Error loading channels:', err);
                statusEl.innerText = `❌ שגיאה: ${err.message}`;
            }
        }

        function renderChannels(channels) {
            const container = document.getElementById('grid-container');
            if (!container) return;
            container.innerHTML = '';

            channels.forEach((ch) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-right p-3 bg-slate-800 hover:bg-slate-700 rounded-xl transition border border-slate-700/50 flex items-center justify-between group cursor-pointer';
                btn.innerHTML = `<span class="font-medium text-sm text-slate-200 group-hover:text-cyan-400">${ch.name}</span><span class="text-xs text-cyan-400">▶ נגן</span>`;
                btn.onclick = () => playStream(ch.url);
                container.appendChild(btn);
            });
        }

        function filterChannels() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allChannels.filter(c => c.name.toLowerCase().includes(query));
            renderChannels(filtered);
        }

        function playStream(url) {
            const video = document.getElementById('video-player');
            if (hls) {
                hls.destroy();
                hls = null;
            }

            const proxyUrl = `/proxy?url=${encodeURIComponent(url)}`;
            const statusEl = document.getElementById('status-msg');
            statusEl.innerText = '▶ טוען ניגון ערוץ...';

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(proxyUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log('Autoplay blocked'));
                    statusEl.innerText = '▶ מנגן בהצלחה!';
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = proxyUrl;
                video.play().catch(e => console.log('Autoplay blocked'));
                statusEl.innerText = '▶ מנגן בהצלחה!';
            }
        }

        // הפעלה אוטומטית מיד כשהדף נטען
        loadChannels();
    </script> 
</body>
</html>
